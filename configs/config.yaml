pipeline:
  device: "cpu"  # Default to CPU for docker portability
  save_debug_masks: true

preprocessing:
  wall_hsv_min: [0, 0, 180]      # Light-gray / white wall top detection
  wall_hsv_max: [180, 40, 255]
  door_closing_kernel_size: 15   # Kernel size to bridge 45-degree door gaps
  bilateral_d: 9
  bilateral_sigma_color: 75
  bilateral_sigma_space: 75

segmentation:
  model_type: "fastsam"          # Options: fastsam, watershed_fallback
  weights: "models/FastSAM-s.pt" # CPU default; switch to models/FastSAM-x.pt for a larger model
  imgsz: 1024
  sam_conf: 0.25
  sam_iou: 0.9
  min_mask_confidence: 0.35      # Below this, a seed falls back to watershed
  min_room_area_px: 2000         # Filter out small furniture/plant masks

geometry:
  douglas_peucker_epsilon: 0.015 # Contour simplification factor
  ortho_snap_tolerance_deg: 10.0 # Snap line segments within +/- 10 degrees to 0/90

ocr:
  enabled: true
  languages: ["en"]

# Iteration 2 (src/v2_reconstruction)
homography:
  canvas_lightness_min: 250      # LAB lightness of the white render background
  canvas_chroma_max: 8
  canny_low: 50
  canny_high: 150
  footprint_close_px: 15         # Seals small gaps in the apartment silhouette
  approx_epsilon_start: 0.01     # approxPolyDP epsilon as a fraction of perimeter
  approx_epsilon_max: 0.12       # Upper bound for the convex-hull fallback quad
  min_wall_length_ratio: 0.15    # Outline segments shorter than this x sqrt(footprint area) are ignored
  wall_axis_tolerance_deg: 25.0  # Max lean of an exterior wall from horizontal/vertical in the render
  side_fit_band_ratio: 0.005     # Contour points within this fraction of perimeter refine each wall line
  max_area_change_ratio: 1.6     # Reject homographies that scale the footprint area beyond this
  output_margin_px: 20

floor_segmentation:
  canvas_lightness_min: 250
  canvas_chroma_max: 8
  flat_window_px: 3              # Small enough to sit inside a thin (~8 px) wall top
  flat_std_max: 4.0              # Wall tops and faces are untextured; bedding and curtains are shaded
  wall_ab_tolerance: 4.0         # Max a/b distance from the shell (exterior wall) colour
  wall_lightness_tolerance: 25.0
  ridge_max_width_px: 37         # Bright regions wider than this are floors or counters, not walls
  ridge_tophat_min: 18           # Min lightness excess over the local background for a wall top
  ridge_lightness_min: 170
  ridge_min_area_px: 60
  ridge_min_aspect: 2.5          # Interior ridge pieces must be elongated unless they touch the shell
  ridge_min_run_px: 41           # Walls are axis-aligned after Phase 1; keep straight runs at least this long
  door_gap_px: 49                # Doorways narrower than this are bridged along the wall axis
  neck_width_px: 41              # Passages narrower than this split one region into two rooms
  neck_min_core_px: 600
  cell_min_inradius_px: 12       # Thinner regions are wall slivers or the exterior face ring, not rooms
  enclosed_max_share: 0.15       # Smaller regions enclosed by another room (rug or table rings) merge into it
  floor_piece_min_inside: 0.85   # A SAM piece must lie at least this much inside the room cell
  floor_piece_min_share: 0.08    # ...and cover at least this share of it (drops faces and decor)
  floor_min_coverage: 0.5        # Below this, SAM missed the floor; keep the wall-top cell
  seam_gradient_percentile: 80
  seam_tolerance_px: 3

rectilinear:
  notch_max_inradius_px: 30      # Bbox gaps thinner than this are furniture notches, not missing corners
  corner_min_share: 0.12         # A missing corner must be at least this share of the bounding box
  rect_fill_min: 0.72            # Above this, one bounding box overwrites the notches
  decompose_min_area_px: 18000   # Smaller masks are one room; do not peel arms off them
  arm_min_share: 0.10            # Leftover pieces smaller than this are notches, not a second room
  grow_coverage: 0.60            # A rectangle side grows while the new strip is this full of mask
  leftover_fill_min: 0.35        # Denser leftovers become their bounding box, filling table holes
  min_rect_area_px: 2000
  max_rects_per_mask: 3
  open_plan_area_ratio: 0.22     # Rectangles larger than this share of the floor are split candidates
  seam_blur_px: 31               # Kills furniture edges so only wall-to-wall material changes remain
  seam_margin_ratio: 0.12        # Ignore gradients in the outer band (those are the walls)
  seam_span_min: 0.55            # A seam must be strong across this fraction of the rectangle
  seam_prominence_min: 2.0       # Peak column/row step must be this many times the median step
  seam_delta_e_min: 8.0          # Min LAB distance between the two sides of a split
  grid_snap_tolerance_px: 15
  min_side_px: 12
